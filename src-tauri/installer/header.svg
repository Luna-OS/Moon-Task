<svg xmlns="http://www.w3.org/2000/svg" width="150" height="57" viewBox="0 0 150 57">
  <!-- Header image of the Windows installer's inner pages (150×57). -->
  <defs>
    <radialGradient id="glow" cx="27" cy="28" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9aefb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b9aefb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fdfbff"/>
      <stop offset="0.55" stop-color="#ddd6ff"/>
      <stop offset="1" stop-color="#a89cf2"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#b9aefb"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="150" height="57" fill="#fff"/>
      <circle cx="33" cy="23" r="13" fill="#000"/>
    </mask>
  </defs>
  <!-- The header strip's own color (MUI_BGCOLOR in theme.nsh), so the image has no edge. -->
  <rect width="150" height="57" fill="#1d1742"/>
  <rect width="150" height="57" fill="url(#glow)"/>
  <circle cx="132" cy="10" r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="142" cy="44" r="0.8" fill="#d6cffd" opacity="0.7"/>
  <circle cx="58" cy="9" r="0.7" fill="#fff" opacity="0.6"/>
  <circle cx="27" cy="28" r="16" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M9 36 H20 L24 29 L28 42 L32 33 L35 36 H45" fill="none" stroke="#7fe3c6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="34" font-family="URW Gothic" font-weight="600" font-size="17" fill="url(#word)">MoonTask</text>
</svg>
