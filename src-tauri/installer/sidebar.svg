<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <!-- Welcome/finish page image of the Windows installer (164×314). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2060"/>
      <stop offset="0.55" stop-color="#141030"/>
      <stop offset="1" stop-color="#0b0920"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#b9aefb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b9aefb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fdfbff"/>
      <stop offset="0.55" stop-color="#ddd6ff"/>
      <stop offset="1" stop-color="#a89cf2"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset="0.5" stop-color="#d6cffd"/>
      <stop offset="1" stop-color="#b9aefb"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="164" height="314" fill="#fff"/>
      <circle cx="99" cy="70" r="36" fill="#000"/>
    </mask>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="164" height="314" fill="url(#bg)"/>
  <rect width="164" height="314" fill="url(#glow)"/>
  <g fill="#fff">
    <circle cx="18" cy="24" r="1" opacity="0.8"/>
    <circle cx="140" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="126" cy="126" r="0.9" opacity="0.6"/>
    <circle cx="30" cy="140" r="1.1" opacity="0.7"/>
    <circle cx="148" cy="210" r="1" opacity="0.55"/>
    <circle cx="14" cy="236" r="0.9" opacity="0.5"/>
    <circle cx="96" cy="262" r="1.2" opacity="0.6"/>
    <circle cx="52" cy="292" r="0.8" opacity="0.5"/>
    <circle cx="60" cy="18" r="0.8" opacity="0.6"/>
    <circle cx="150" cy="286" r="1" opacity="0.5"/>
  </g>
  <circle cx="22" cy="92" r="1.2" fill="#9ad7f5" opacity="0.8"/>
  <circle cx="142" cy="166" r="1.2" fill="#d6cffd" opacity="0.8"/>
  <circle cx="82" cy="80" r="44" fill="#b9aefb" opacity="0.35" filter="url(#blur)" mask="url(#crescent)"/>
  <circle cx="82" cy="80" r="44" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M26 110 H58 L68 90 L81 128 L93 99 L100 110 H138" fill="none" stroke="#7fe3c6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#blur)"/>
  <path d="M26 110 H58 L68 90 L81 128 L93 99 L100 110 H138" fill="none" stroke="#7fe3c6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="178" text-anchor="middle" font-family="URW Gothic" font-weight="600" font-size="27" letter-spacing="0.3" fill="url(#word)">MoonTask</text>
  <text x="82" y="200" text-anchor="middle" font-family="URW Gothic" font-size="10.5" fill="#d6cffd" fill-opacity="0.72">every process,</text>
  <text x="82" y="214" text-anchor="middle" font-family="URW Gothic" font-size="10.5" fill="#d6cffd" fill-opacity="0.72">calmly under the moon</text>
  <rect x="62" y="236" width="40" height="1" fill="#b9aefb" opacity="0.35"/>
</svg>
