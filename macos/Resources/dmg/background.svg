<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Background of the macOS disk image window (660×400). The app icon sits
       at (170, 190) and the Applications link at (490, 190), see dmg-settings.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a2060"/>
      <stop offset="0.55" stop-color="#16112f"/>
      <stop offset="1" stop-color="#0b0920"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#b9aefb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b9aefb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9aefb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b9aefb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fdfbff"/>
      <stop offset="0.55" stop-color="#ddd6ff"/>
      <stop offset="1" stop-color="#a89cf2"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9aefb" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d6cffd" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="660" height="400" fill="#fff"/>
      <circle cx="596" cy="44" r="22" fill="#000"/>
    </mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glow)"/>
  <g fill="#fff">
    <circle cx="40" cy="36" r="1" opacity="0.7"/>
    <circle cx="120" cy="70" r="0.8" opacity="0.5"/>
    <circle cx="232" cy="28" r="1.2" opacity="0.8"/>
    <circle cx="318" cy="84" r="0.9" opacity="0.55"/>
    <circle cx="410" cy="40" r="1" opacity="0.6"/>
    <circle cx="520" cy="96" r="0.8" opacity="0.5"/>
    <circle cx="630" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="60" cy="300" r="0.9" opacity="0.5"/>
    <circle cx="300" cy="330" r="1" opacity="0.45"/>
    <circle cx="610" cy="330" r="1.2" opacity="0.55"/>
    <circle cx="20" cy="170" r="0.8" opacity="0.4"/>
    <circle cx="350" cy="250" r="0.7" opacity="0.4"/>
  </g>
  <circle cx="160" cy="120" r="1.3" fill="#9ad7f5" opacity="0.8"/>
  <circle cx="560" cy="250" r="1.2" fill="#d6cffd" opacity="0.8"/>
  <!-- A crescent moon in the corner. -->
  <circle cx="584" cy="52" r="28" fill="#b9aefb" opacity="0.35" filter="url(#blur)" mask="url(#crescent)"/>
  <circle cx="584" cy="52" r="26" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- Soft halos where the two icons sit. -->
  <circle cx="170" cy="190" r="95" fill="url(#halo)"/>
  <circle cx="490" cy="190" r="95" fill="url(#halo)"/>
  <!-- Mid-tone pills behind the icon names, so Finder's labels read in both
       its light (black text) and dark (white text) appearance. -->
  <rect x="100" y="247" width="140" height="24" rx="12" fill="#8f82e0" opacity="0.92"/>
  <rect x="420" y="247" width="140" height="24" rx="12" fill="#8f82e0" opacity="0.92"/>
  <!-- The arrow from the app to Applications. -->
  <path d="M258 190 C 300 160, 360 160, 400 186" fill="none" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
  <path d="M392 176 L 404 188 L 388 193" fill="none" stroke="#d6cffd" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="330" text-anchor="middle" font-family="URW Gothic" font-weight="600" font-size="17" fill="#f4f1ff">Drag MoonTask into Applications</text>
  <text x="330" y="354" text-anchor="middle" font-family="URW Gothic" font-size="12" fill="#d6cffd" fill-opacity="0.72">every process, calmly under the moon</text>
</svg>
