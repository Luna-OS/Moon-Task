name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out for now; the code for it stays in the tree.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri::generate_context! embeds the built frontend; an empty dist/
      # is enough for checking and testing the Rust side.
      - name: Placeholder frontend build
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The tests start, suspend and end real (own, harmless) child
      # processes and open a local socket — MoonTask's control paths are
      # exercised for real on Linux and Windows, never mocked.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  tauri-build-check:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci
      # Debug build only: proves the whole stack (frontend build ->
      # cargo build -> bundling) still works on every platform, without
      # spending release-workflow-level time on an optimized build.
      - run: npx tauri build --debug --bundles ${{ matrix.bundles }}

      # Start the app for real and make sure it's still running after 20 s.
      # Tests never open a window; this catches crashes in the window and
      # webview start-up (like a COM mode clash with WebView2 on Windows).
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a src-tauri/target/debug/moontask > app.log 2>&1 &
          sleep 20
          if ! pgrep -x moontask > /dev/null; then
            echo "MoonTask exited during start-up:"; cat app.log
            cat /tmp/moontask-crash.log 2>/dev/null || true
            exit 1
          fi
          pkill -x moontask

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath src-tauri\target\debug\moontask.exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Host "MoonTask exited during start-up with code $($app.ExitCode)"
            $log = Join-Path $env:TEMP 'moontask-crash.log'
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          Stop-Process -Id $app.Id

      # Screenshots of every installer page, to review the installer's theme
      # on real Windows. Informational only, so it never fails the build.
      - name: Installer screenshots (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri\target\debug\bundle\nsis\*-setup.exe | Select-Object -First 1
          .github\scripts\installer-screenshots.ps1 -Setup $setup.FullName -Out installer-screenshots
      - name: Upload installer screenshots
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-screenshots
          path: installer-screenshots
          if-no-files-found: ignore
